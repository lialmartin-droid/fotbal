<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fotbal 1v1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="score">
        <span class="team player-team">TY</span>
        <strong id="playerScore">0</strong>
        <span class="dash">:</span>
        <strong id="aiScore">0</strong>
        <span class="team ai-team">AI</span>
      </div>

      <div id="timer" class="timer">02:00</div>
    </header>

    <section class="field-wrap">
      <canvas id="gameCanvas" width="900" height="1400" aria-label="Fotbalové hřiště"></canvas>

      <div id="goalMessage" class="goal-message hidden">GÓL!</div>
      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <h1>Fotbal 1v1</h1>
          <p>Joystickem se pohybuj. Tlačítkem STŘELA kopni do míče.</p>
          <button id="startBtn">ZAČÍT ZÁPAS</button>
        </div>
      </div>

      <div id="endOverlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="resultTitle">Konec zápasu</h2>
          <p id="resultText"></p>
          <button id="restartBtn">HRÁT ZNOVU</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <div id="joystick" class="joystick" aria-label="Joystick">
        <div id="stick" class="stick"></div>
      </div>

      <button id="shootBtn" class="shoot-btn">STŘELA</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
