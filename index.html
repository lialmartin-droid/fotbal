<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fotbal 3v3</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="score">
        <span class="team blue">TY</span>
        <strong id="playerScore">0</strong>
        <span>:</span>
        <strong id="aiScore">0</strong>
        <span class="team red">AI</span>
      </div>
      <div id="timer" class="timer">02:00</div>
    </header>

    <section class="field-wrap">
      <canvas id="gameCanvas" width="900" height="1400"></canvas>

      <div id="message" class="game-message hidden">GÓL!</div>

      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <h1>Fotbal 3v3</h1>
          <p>
            PC: WASD nebo šipky.<br>
            Mobil: joystick vlevo.<br>
            Míč kopeš automaticky ve směru pohybu.
          </p>
          <button id="startBtn" type="button">ZAČÍT ZÁPAS</button>
          <small class="start-hint">Enter nebo mezerník také spustí zápas.</small>
        </div>
      </div>

      <div id="endOverlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="resultTitle">Konec zápasu</h2>
          <p id="resultText"></p>
          <button id="restartBtn" type="button">HRÁT ZNOVU</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <div id="joystick" class="joystick">
        <div id="stick" class="stick"></div>
      </div>

      <div class="control-help">
        <strong>OVLÁDÁNÍ</strong>
        <span>WASD / šipky</span>
        <small>Aktivní hráč má žlutý kruh.</small>
      </div>
    </section>
  </main>
</body>
</html>
